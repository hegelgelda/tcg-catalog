<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JP TCG Wholesale Catalog</title>
<style>
:root{
  --bg0:#0f1117;--bg1:#181c27;--bg2:#1e2336;--bg3:#252a40;
  --border:#2e3450;--border2:#3a4160;
  --text0:#f0f2ff;--text1:#b8bdd8;--text2:#6b728a;
  --accent:#4f8ef7;--accent2:#7eb3ff;
  --green:#3ecf8e;--red:#f76f72;--gold:#f0c060;
  --radius:8px;--radius2:12px;
  font-family:'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg0);color:var(--text0);font-size:13px}
button,input,select{font-family:inherit;font-size:inherit}

/* ── Layout ─────────────────────────── */
.app{display:grid;grid-template-columns:220px 1fr 310px;height:100vh;overflow:hidden}

/* ── Sidebar ─────────────────────────── */
.sidebar{background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-top{padding:16px 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-title{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text2);text-transform:uppercase;margin-bottom:12px}
.sidebar-scroll{overflow-y:auto;flex:1;padding:8px 0}
.series-label{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 14px;font-size:12px;font-weight:600;color:var(--text2);
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
  user-select:none;
}
.series-label.top{color:var(--accent2);font-size:13px;padding:11px 14px}
.series-label.top.disabled{color:var(--text2);cursor:default}
.series-label.top.disabled:hover{color:var(--text2)}
.series-label.sub{padding:6px 14px 6px 22px;font-size:11px}
.series-label:hover{color:var(--text1)}
.series-label.top:hover{color:var(--text0)}
.coming-soon{font-size:9px;font-weight:400;color:var(--text2);letter-spacing:.04em}
.series-label.top.cat-active{color:var(--text0);background:var(--bg3)}
.category-block{border-bottom:1px solid var(--border)}
.series-label .arrow{font-size:9px;transition:transform .18s}
.series-label.open .arrow{transform:rotate(90deg)}
.set-list{display:none}
.set-list.open{display:block}
.set-btn{
  display:flex;align-items:baseline;gap:6px;
  width:100%;padding:6px 14px 6px 20px;
  border:none;background:none;cursor:pointer;text-align:left;
  transition:background .12s;border-radius:0;
}
.set-btn:hover{background:var(--bg2)}
.set-btn.active{background:var(--bg3)}
.set-btn .sid{font-size:11px;font-weight:600;color:var(--text2);min-width:44px;flex-shrink:0}
.set-btn.active .sid{color:var(--accent2)}
.set-btn .sname{font-size:12px;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-btn.active .sname{color:var(--text0)}

/* rarity filter */
.rarity-section{padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0}
.rarity-section-title{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text2);text-transform:uppercase;margin-bottom:8px}
.rarity-check{
  display:flex;align-items:center;gap:8px;
  padding:4px 0;cursor:pointer;color:var(--text1);font-size:12px;
  border-radius:4px;
}
.rarity-check input{accent-color:var(--accent);cursor:pointer;width:13px;height:13px;flex-shrink:0}

/* ── Main ─────────────────────────── */
.main{background:var(--bg0);display:flex;flex-direction:column;overflow:hidden}
.main-header{padding:16px 20px 0;flex-shrink:0}
.main-header h2{font-size:16px;font-weight:600;margin-bottom:2px}
.main-header p{font-size:12px;color:var(--text2)}
.search-wrap{padding:12px 20px 0;flex-shrink:0}
.search-wrap input{
  width:100%;padding:10px 14px;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--radius);color:var(--text0);outline:none;
  font-size:13px;
}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text2)}
.card-scroll{flex:1;overflow-y:auto;padding:14px 20px 20px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.card-item{
  background:var(--bg1);border:1px solid var(--border);
  border-radius:var(--radius2);overflow:hidden;
  transition:border-color .15s;
}
.card-item:hover{border-color:var(--border2)}
.card-img{width:100%;aspect-ratio:2.5/3.5;object-fit:cover;display:block;background:var(--bg2)}
.card-img-ph{width:100%;aspect-ratio:2.5/3.5;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text2)}
.card-info{padding:8px 9px 10px}
.card-num{font-size:10px;color:var(--text2);margin-bottom:1px}
.card-en{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-jp{font-size:11px;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rarity-badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;margin-top:5px;font-weight:600;letter-spacing:.02em}
.r-Common{background:#2a2d1e;color:#9acd60}
.r-Uncommon{background:#1a2535;color:#6eb4f7}
.r-Rare{background:#2a2010;color:#e0a030}
.r-Double-Rare{background:#221a35;color:#b090f0}
.r-Ultra-Rare{background:#2a1010;color:#f07070}
.r-Radiant-Rare{background:#10281a;color:#50d090}
.r-Shiny-Rare{background:#1e2530;color:#80c8f8}
.r-Shiny-Ultra-Rare{background:#251020;color:#f080c0}
.card-add{display:flex;gap:5px;margin-top:8px;align-items:center}
.price-tag{
  display:inline-block;min-width:54px;height:28px;
  padding:0 8px;line-height:28px;
  text-align:center;font-size:12px;font-weight:600;
  background:var(--bg0);border:1px solid var(--border);
  border-radius:6px;color:var(--green);white-space:nowrap;
}
.price-tag.custom{color:var(--gold);border-color:rgba(240,192,96,.3)}
.price-tag.loading{color:var(--text2);font-weight:400;font-size:11px}
.add-btn{
  flex:1;height:28px;font-size:12px;font-weight:500;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:6px;cursor:pointer;color:var(--text1);
  transition:all .12s;
}
.add-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.empty-state{padding:60px 20px;text-align:center;color:var(--text2)}

/* ── Cart / Order ─────────────────────────── */
.cart{background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.cart-header{padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
.cart-header h3{font-size:15px;font-weight:600;margin-bottom:12px}
.field-label{font-size:11px;color:var(--text2);margin-bottom:4px;display:block}
.buyer-input,.currency-sel{
  width:100%;padding:7px 10px;margin-bottom:8px;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--radius);color:var(--text0);outline:none;
  -webkit-appearance:none;appearance:none;
}
.buyer-input:focus,.currency-sel:focus{border-color:var(--accent)}
.buyer-input::placeholder{color:var(--text2)}
.cart-items{flex:1;overflow-y:auto;padding:8px 14px}
.cart-empty{text-align:center;padding:40px 16px;color:var(--text2)}
.cart-item{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)}
.cart-item-img{width:36px;height:50px;object-fit:cover;border-radius:4px;background:var(--bg2);flex-shrink:0}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-sub{font-size:11px;color:var(--text2);margin-top:2px}
.qty-ctrl{display:flex;align-items:center;gap:5px;margin-top:5px}
.qty-btn{width:20px;height:20px;border:1px solid var(--border2);border-radius:4px;background:none;cursor:pointer;font-size:12px;color:var(--text1);display:flex;align-items:center;justify-content:center}
.qty-btn:hover{background:var(--bg3)}
.qty-num{font-size:13px;min-width:16px;text-align:center}
.ea-price{font-size:10px;color:var(--text2);margin-left:3px}
.remove-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:16px;flex-shrink:0;line-height:1;padding:0}
.remove-btn:hover{color:var(--red)}
.item-total{font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0}
.cart-footer{padding:14px;border-top:1px solid var(--border);flex-shrink:0}
.cart-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:3px 0}
.cart-total{display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding:10px 0 0;border-top:1px solid var(--border);margin-top:6px}
.submit-btn{
  width:100%;padding:11px;margin-top:12px;
  font-size:14px;font-weight:600;
  background:var(--accent);color:#fff;
  border:none;border-radius:var(--radius);cursor:pointer;
  transition:opacity .15s;
}
.submit-btn:hover{opacity:.88}
.submit-btn:disabled{opacity:.3;cursor:not-allowed}

/* ── Modal ─────────────────────────── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);z-index:100;
  align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--radius2);padding:28px;max-width:420px;width:90%;
}
.modal h2{font-size:18px;margin-bottom:8px}
.modal p{color:var(--text1);line-height:1.6;font-size:13px}
.modal-close{
  margin-top:20px;width:100%;padding:10px;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--radius);cursor:pointer;color:var(--text0);font-size:14px;font-weight:500;
}
.modal-close:hover{background:var(--border2)}

/* spinner */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="app">

<!-- ── Sidebar ── -->
<div class="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-title">Sets</div>
  </div>
  <div class="sidebar-scroll" id="sidebar-sets"></div>
  <div class="rarity-section">
    <div class="rarity-section-title">Rarity</div>
    <div id="rarity-filters"><div style="color:var(--text2);font-size:12px">Select a set</div></div>
  </div>
</div>

<!-- ── Main ── -->
<div class="main">
  <div class="main-header">
    <h2 id="main-title">JP Wholesale Catalog</h2>
    <p id="main-sub">Select a set from the sidebar, or search all 8,546 cards below.</p>
  </div>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="🔍  Search all cards — name (EN / JP) or card number…" oninput="onSearch()">
  </div>
  <div class="card-scroll">
    <div id="content"><div class="empty-state">Choose a set from the sidebar.</div></div>
  </div>
</div>

<!-- ── Order Panel ── -->
<div class="cart">
  <div class="cart-header">
    <h3>Order <span id="cart-count" style="font-size:12px;color:var(--text2);font-weight:400"></span></h3>
    <label class="field-label">Buyer name</label>
    <input class="buyer-input" id="buyer-name" placeholder="Name">
    <label class="field-label">Company</label>
    <input class="buyer-input" id="buyer-company" placeholder="Shop / Company">
    <label class="field-label">Email</label>
    <input class="buyer-input" id="buyer-email" type="email" placeholder="email@example.com">
    <label class="field-label">Currency</label>
    <select class="currency-sel" id="currency" onchange="renderCart()">
            <option value="USD">USD</option>
    </select>
  </div>
  <div class="cart-items" id="cart-items"><div class="cart-empty">No items yet.</div></div>
  <div class="cart-footer">
    <div id="cart-summary"></div>
    <button class="submit-btn" id="submit-btn" onclick="submitOrder()" disabled>Submit Order</button>
  </div>
</div>

</div><!-- .app -->



<!-- ── Confirmation Modal ── -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">✓ Order Submitted</h2>
    <p id="modal-body">Your order has been received. We will contact you shortly.</p>
    <button class="modal-close" onclick="closeModal()">Close</button>
  </div>
</div>

// ── State ──
let currentSet = null, cart = {}, searchQ = '';
let cardPrices = {};   // { card_id: price_usd } loaded from Sheets
let pricesLoaded = false;

// ── Load prices from Google Sheets via GAS doGet ──
async function loadPrices(){
  const tags = document.querySelectorAll('.price-tag');
  tags.forEach(t=>{t.textContent='…';t.className='price-tag loading'});
  try {
    const r = await fetch(GAS_URL, {mode:'cors', redirect:'follow'});
    const d = await r.json();
    if(d.status==='ok') cardPrices = d.prices || {};
  } catch(e) {
    console.warn('Price fetch failed, using defaults', e);
  }
  pricesLoaded = true;
  renderCards(); // re-render once prices are ready
}

function getPrice(key, rarity){
  if(cardPrices[key] !== undefined) return cardPrices[key];
  return DP[rarity] || 1;
}

function isPriceCustom(key){ return cardPrices[key] !== undefined; }

// ── Helpers ──
function getSym(){return {USD:'$',SGD:'S$',HKD:'HK$',JPY:'¥',PHP:'₱'}[document.getElementById('currency').value]||'$'}
function conv(u){return (u * (FX[document.getElementById('currency').value]||1)).toFixed(2)}
function imgUrl(s,n){return `https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpc/${s}/${s}_${n}_R_JP_LG.png`}
function rClass(r){return 'r-'+r.replace(/\s+/g,'-')}

// ── Sidebar ──
function renderSidebar(){
  const inner = SERIES.map(s=>`

      <div class="series-label sub" id="grp-${s.key}" onclick="toggleGroup('${s.key}')">

function toggleGroup(key){
  const lbl=document.getElementById('grp-'+key), lst=document.getElementById('list-'+key);
  if(!lbl||!lst) return;
  const open=lst.classList.contains('open');
  lbl.classList.toggle('open',!open); lst.classList.toggle('open',!open);
}

function selectSet(id){
  currentSet = id;
  document.querySelectorAll('.set-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+id)?.classList.add('active');

  const allSets = SERIES.flatMap(s=>s.sets);
  const si = allSets.find(s=>s.id===id)||{name:id,jp:'',count:0,rarities:[]};
  const sr = SERIES.find(s=>s.sets.some(st=>st.id===id))||{key:''};

  document.getElementById('main-title').textContent = `${si.name} (${id})`;
  document.getElementById('main-sub').textContent   = `${sr.key} · ${si.jp} · ${si.count} cards`;
  document.getElementById('search').value=''; searchQ='';

  renderRarityFilter(si.rarities);
  renderCards();
}

// ── Rarity Filter (dynamic per set) ──
function renderRarityFilter(rarities){
  document.getElementById('rarity-filters').innerHTML =
    rarities.map(r=>`
      <label class="rarity-check">
        <input type="checkbox" data-r="${r}" checked onchange="renderCards()">
        ${r}
      </label>`).join('');
}

function getActiveRarities(){
  return new Set([...document.querySelectorAll('[data-r]:checked')].map(i=>i.dataset.r));
}

// ── Card Grid ──

  const rf = getActiveRarities();

    (!searchQ || c.en.toLowerCase().includes(searchQ) || c.jp.includes(searchQ) || c.n===searchQ)

    const tagText  = loading ? '…' : `${sym}${conv(price)}`;
    return `<div class="card-item">
      <img class="card-img" src="${imgUrl(currentSet,c.n)}" alt="${c.en}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="card-img-ph" style="display:none">No image</div>
      <div class="card-info">
        <div class="card-num">#${c.n}</div>
        <div class="card-en">${c.en}</div>
        <div class="card-jp">${c.jp}</div>
        <span class="rarity-badge ${rClass(c.r)}">${c.r}</span>
        <div class="card-add">
          <span class="${tagClass}" id="p-${key}">${tagText}</span>
          <button class="add-btn" onclick="addToCart('${key}','${c.en}','${c.jp}','${c.r}','${c.n}','${currentSet}','Singles')">Add</button>
        </div>
      </div></div>`;
  }).join('')}</div>`;
}

function onSearch(){
  searchQ = document.getElementById('search').value.toLowerCase().trim();
  if(currentSet){
    renderCards();
  } else if(searchQ.length >= 2){
    renderGlobalSearch();
  } else {
    document.getElementById('main-title').textContent='JP Wholesale Catalog';
    document.getElementById('main-sub').textContent='Select a set from the sidebar, or search all 8,546 cards above.';
    document.getElementById('content').innerHTML='<div class="empty-state">Choose a set from the sidebar, or type to search all cards.</div>';
  }
}

// ── Cart ──
function addToCart(key,en,jp,r,n,setId,productType,psaGrade,psaCert){
  const price = getPrice(key, r);
  if(cart[key]){ cart[key].qty++; }
  else {
    cart[key]={
      en,jp,r,n,setId,price,qty:1,
      productType: productType||'Singles',
      psaGrade: psaGrade||'',
      psaCert:  psaCert||'',
    };
  }
  renderCart();
}

function changeQty(key,d){
  if(!cart[key]) return;
  cart[key].qty+=d;
  if(cart[key].qty<=0) delete cart[key];
  renderCart();
}

function renderCart(){
  const keys=Object.keys(cart);
  const count=keys.reduce((s,k)=>s+cart[k].qty,0);
  document.getElementById('cart-count').textContent=count?`· ${count} items`:'';
  const sym=getSym();

  if(!keys.length){
    document.getElementById('cart-items').innerHTML='<div class="cart-empty">No items yet.</div>';
    document.getElementById('cart-summary').innerHTML='';
    document.getElementById('submit-btn').disabled=true;
    return;
  }

  document.getElementById('cart-items').innerHTML=keys.map(k=>{
    const it=cart[k];
    return `<div class="cart-item">
      <img class="cart-item-img" src="${imgUrl(it.setId,it.n)}"
           onerror="this.style.background='var(--bg2)'">
      <div class="cart-item-info">
        <div class="cart-item-name">${it.en}</div>
        <div class="cart-item-sub">${it.setId} #${it.n} · ${it.r}</div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${k}',-1)">−</button>
          <span class="qty-num">${it.qty}</span>
          <button class="qty-btn" onclick="changeQty('${k}',1)">＋</button>
          <span class="ea-price">${sym}${conv(it.price)} ea</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="item-total">${sym}${conv(it.price*it.qty)}</span>
        <button class="remove-btn" onclick="delete cart['${k}'];renderCart()">×</button>
      </div>
    </div>`;
  }).join('');

  const sub=keys.reduce((s,k)=>s+cart[k].price*cart[k].qty,0);
  document.getElementById('cart-summary').innerHTML=`
    <div class="cart-row"><span>Items (${count})</span><span>${sym}${conv(sub)}</span></div>
    <div class="cart-row"><span>Shipping</span><span>TBD</span></div>
    <div class="cart-total"><span>Total</span><span>${sym}${conv(sub)}</span></div>`;
  document.getElementById('submit-btn').disabled=false;
}

// ── Submit to Google Sheets ──
async function submitOrder(){
  const buyer   = document.getElementById('buyer-name').value.trim();
  const company = document.getElementById('buyer-company').value.trim();
  const email   = document.getElementById('buyer-email').value.trim();
  const cur     = document.getElementById('currency').value;
  const keys    = Object.keys(cart);

  if(!keys.length) return;
  if(!email){ alert('Please enter your email address.'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting…';

  const totalUSD = keys.reduce((s,k)=>s+cart[k].price*cart[k].qty, 0);
  const items = keys.map(k=>({
    productType: cart[k].productType || 'Singles',
    setId:       cart[k].setId,
    number:      cart[k].n,
    nameEn:      cart[k].en,
    nameJp:      cart[k].jp,
    rarity:      cart[k].r,
    qty:         cart[k].qty,
    priceUSD:    cart[k].price,
    lineTotalUSD:+(cart[k].price * cart[k].qty).toFixed(2),
    psaGrade:    cart[k].psaGrade || '',
    psaCert:     cart[k].psaCert  || '',
  }));

  const payload = { buyer, company, email, currency: cur, totalUSD: +totalUSD.toFixed(2), items };

  try {
    // GAS requires no-cors mode for public web apps
    await fetch(GAS_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    // no-cors: can't read response body, assume success if no network error
    cart = {};
    renderCart();
    showModal('✓ Order Submitted',
      `Thank you, ${buyer||email}! Your order has been received.\nWe will contact you at ${email} shortly.`);
  } catch(err){
    showModal('⚠ Submission Failed',
      'Could not send the order. Please take a screenshot of your cart and contact us directly.');
    btn.disabled = false;
    btn.innerHTML = 'Submit Order';
  }
}

function showModal(title, body){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent  = body;
  document.getElementById('modal').classList.add('show');
  document.getElementById('submit-btn').innerHTML = 'Submit Order';
}
function closeModal(){ document.getElementById('modal').classList.remove('show') }

// ── Global Search (inline in main area) ──
function renderGlobalSearch(){
  const q = searchQ;
  if(q.length < 2){
    document.getElementById('content').innerHTML='<div class="empty-state">Type at least 2 characters to search all cards.</div>';
    return;
  }
  const results = [];
  for(const [setId, cards] of Object.entries(CARDS)){
    for(const c of cards){
      if(c.en.toLowerCase().includes(q) || c.jp.includes(q) || c.n===q){
        results.push({...c, setId});
      }
    }
  }
  if(!results.length){
    document.getElementById('main-title').textContent='Search results';
    document.getElementById('main-sub').textContent='0 cards found';
    document.getElementById('content').innerHTML='<div class="empty-state">No cards found.</div>';
    return;
  }
  const sym=getSym();
  const shown=results.slice(0,200);
  document.getElementById('main-title').textContent='Search results';
  document.getElementById('main-sub').textContent=`${results.length} cards found${results.length>200?' (showing first 200)':''}`;
  document.getElementById('content').innerHTML=`<div class="card-grid">${shown.map(c=>{
    const key=`${c.setId}-${c.n}`;
    const price=getPrice(key,c.r);
    const custom=isPriceCustom(key);
    const tagClass=custom?'price-tag custom':'price-tag';
    return `<div class="card-item">
      <img class="card-img" src="${imgUrl(c.setId,c.n)}" alt="${c.en}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="card-img-ph" style="display:none">No image</div>
      <div class="card-info">
        <div class="card-num">${c.setId} #${c.n}</div>
        <div class="card-en">${c.en}</div>
        <div class="card-jp">${c.jp}</div>
        <span class="rarity-badge ${rClass(c.r)}">${c.r}</span>
        <div class="card-add">
          <span class="${tagClass}">${sym}${conv(price)}</span>
          <button class="add-btn" onclick="addToCart('${key}','${c.en}','${c.jp}','${c.r}','${c.n}','${c.setId}','Singles')">Add</button>
        </div>
      </div></div>`;
  }).join('')}</div>`;
}

// ── Category switching ──
let currentCategory = 'singles'; // 'singles' | 'box'

function selectCategory(cat){
  currentCategory = cat;
  currentSet = null;
  searchQ = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('.set-btn').forEach(b=>b.classList.remove('active'));
  // highlight active category
  document.querySelectorAll('.series-label.top').forEach(el=>el.classList.remove('cat-active'));
  if(cat==='box') document.getElementById('cat-box')?.classList.add('cat-active');
  renderRarityFilter([]);
  if(cat==='box') renderBoxes();
}

function renderBoxes(){
  document.getElementById('main-title').textContent = 'BOX';
  document.getElementById('main-sub').textContent   = `${BOXES.length} products`;
  const sym = getSym();
  if(!BOXES.length){
    document.getElementById('content').innerHTML='<div class="empty-state">No BOX products registered yet.</div>';
    return;
  }
  document.getElementById('content').innerHTML=`<div class="card-grid">${BOXES.map(b=>{
    const key   = b.id;
    const price = cardPrices[key] !== undefined ? cardPrices[key] : 0;
    const imgSrc = b.image_url || b.logo_url || '';
    const tagClass = cardPrices[key]!==undefined ? 'price-tag custom' : 'price-tag';
    const tagText  = price ? `${sym}${conv(price)}` : 'TBD';
    return `<div class="card-item">
      ${imgSrc
        ? `<img class="card-img" src="${imgSrc}" alt="${b.name_en}" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="card-img-ph" style="${imgSrc?'display:none':'display:flex'}">No image</div>
      <div class="card-info">
        <div class="card-num">${b.set_id||''}</div>
        <div class="card-en">${b.name_en}</div>
        <div class="card-jp">${b.name_jp}</div>
        <span class="rarity-badge r-Rare">BOX</span>
        <div class="card-add">
          <span class="${tagClass}">${tagText}</span>
          <button class="add-btn" onclick="addToCart('${key}','${b.name_en}','${b.name_jp}','BOX','—','${b.set_id||'BOX'}','BOX')">Add</button>
        </div>
      </div></div>`;
  }).join('')}</div>`;
}

// ── Init ──
renderSidebar();
renderCart();
if(GAS_URL !== 'YOUR_GAS_WEBAPP_URL_HERE') loadPrices();
else { pricesLoaded = true; }
